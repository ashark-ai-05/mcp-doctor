[package]
name = "mcp-doctor"
version = "0.2.1"
edition = "2024"
description = "Record, replay, and debug MCP JSON-RPC from your terminal"
license = "MIT"
repository = "https://github.com/ashark-ai-05/mcp-doctor"
readme = "README.md"
keywords = ["mcp", "json-rpc", "cli", "debugging", "devtools"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
